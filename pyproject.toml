[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardcommit"
version = "0.1.0"
description = "A blazing fast Git AI code reviewer, secret leak detector & conventional commit generator."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Abhishek Koiri", email = "abhishekkoiri.ak@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]

[project.scripts]
guardcommit = "guardcommit.cli:app"
guard-commit = "guardcommit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["guardcommit"]
